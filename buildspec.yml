version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "423351912095"
    IMAGE_REPO_NAME: "station-dev-django"

phases:
  pre_build:
    commands:
      - |
        if [ -d "$CODEBUILD_SRC_DIR/station-django" ]; then
          PROJECT_DIR="$CODEBUILD_SRC_DIR/station-django"
        elif [ -d "$CODEBUILD_SRC_DIR" ]; then
          PROJECT_DIR="$CODEBUILD_SRC_DIR"
        else
          echo "Could not determine project directory"
          exit 1
        fi
        cd "$PROJECT_DIR"
        echo "Using project directory: $PROJECT_DIR"
        echo "Logging in to Amazon ECR..."
        ACCOUNT_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_URI
        IMAGE_TAG=$(printf '%.7s' "$CODEBUILD_RESOLVED_SOURCE_VERSION")
        if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi
        echo "IMAGE_TAG=$IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ACCOUNT_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - docker push $ACCOUNT_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"django","imageUri":"%s"}]' "$ACCOUNT_URI/$IMAGE_REPO_NAME:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

      - echo "Creating imageDetail.json..."
      - printf '{"ImageURI":"%s"}' "$ACCOUNT_URI/$IMAGE_REPO_NAME:$IMAGE_TAG" > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - taskdef.json
    - appspec.yaml
    - imageDetail.json
    - imagedefinitions.json
  base-directory: .
